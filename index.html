<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台股盤後籌碼與多空評分儀表板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 20px;
      line-height: 1.5;
    }
    .container { max-width: 1680px; margin: 0 auto; }
    
    /* 頂部標題列 */
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .header h1 { font-size: 24px; font-weight: 700; color: #ffffff; letter-spacing: 0.5px; }
    .subtitle { font-size: 13px; color: #94a3b8; margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .update-badge { background: #1e293b; color: #38bdf8; padding: 2px 8px; border-radius: 4px; font-size: 12px; }

    /* 按鈕樣式 */
    .btn-group { display: flex; gap: 10px; }
    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-primary { background-color: #0284c7; color: #ffffff; }
    .btn-primary:hover { background-color: #0369a1; }
    .btn-secondary { background-color: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    .btn-secondary:hover { background-color: #334155; }

    /* 主卡片與表格 */
    .card {
      background-color: #131a2a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    .table-wrapper { overflow-x: auto; width: 100%; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; text-align: right; }
    thead th {
      background-color: #0f172a;
      color: #94a3b8;
      font-weight: 600;
      padding: 14px 12px;
      border-bottom: 1px solid #1e293b;
      font-size: 12px;
    }
    tbody tr { border-bottom: 1px solid rgba(30, 41, 59, 0.7); transition: background 0.15s; }
    tbody tr:hover { background-color: rgba(30, 41, 59, 0.45); }
    td { padding: 12px; }

    /* 凍結首欄日期 */
    .sticky-col {
      position: sticky;
      left: 0;
      background-color: #131a2a;
      text-align: left;
      font-weight: 600;
      color: #f8fafc;
      z-index: 2;
      border-right: 1px solid #1e293b;
    }
    thead .sticky-col { background-color: #0f172a; z-index: 3; }

    /* 台股紅綠配色與燈號 */
    .tw-up { color: #ef4444; font-weight: 600; }
    .tw-down { color: #22c55e; font-weight: 600; }
    .tw-neutral { color: #cbd5e1; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
    .dot-red { background-color: #ef4444; box-shadow: 0 0 6px #ef4444; }
    .dot-green { background-color: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .dot-neutral { background-color: #64748b; }

    /* 趨勢標籤與分數按鈕 */
    .badge { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; display: inline-block; }
    .badge-strong-up { background: rgba(127, 29, 29, 0.6); color: #fca5a5; border: 1px solid #b91c1c; }
    .badge-up { background: rgba(69, 10, 10, 0.6); color: #f87171; border: 1px solid #7f1d1d; }
    .badge-strong-down { background: rgba(6, 78, 59, 0.6); color: #6ee7b7; border: 1px solid #047857; }
    .badge-down { background: rgba(2, 44, 34, 0.6); color: #34d399; border: 1px solid #065f46; }
    .badge-flat { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }

    .score-btn {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      text-decoration: underline dotted;
    }
    .score-btn:hover { background: #334155; }

    .action-link { background: none; border: none; cursor: pointer; font-size: 12px; margin: 0 4px; }
    .edit-link { color: #38bdf8; }
    .del-link { color: #94a3b8; }
    .del-link:hover { color: #ef4444; }

    /* 彈出視窗 (預設隱藏) */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: #131a2a;
      border: 1px solid #334155;
      border-radius: 12px;
      width: 100%;
      max-width: 780px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-box.small { max-width: 500px; }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .modal-header h2 { font-size: 18px; color: #fff; }
    .close-btn { background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; }
    .close-btn:hover { color: #fff; }

    /* 表單網格 */
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .form-group input {
      width: 100%;
      padding: 8px 10px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 13px;
    }
    .form-group input:focus { outline: none; border-color: #38bdf8; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #1e293b; padding-top: 16px; }

    /* 明細列表 */
    .detail-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .detail-desc { color: #94a3b8; font-size: 12px; margin-left: 8px; }

    /* 捲軸美化 */
    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body>

<div class="container">
  <!-- 頂部標題與操作 -->
  <div class="header">
    <div>
      <h1>台股盤後籌碼與多空評分儀表板</h1>
      <div class="subtitle">
        <span><i class="dot dot-red"></i>紅燈偏多 (+1分) ／ <i class="dot dot-green"></i>綠燈偏空 (-1分)</span>
        <span>｜ 點擊「最終分數」可檢視 14 項指標明細</span>
        <span id="lastUpdateBadge" class="update-badge">讀取自動抓取資料中...</span>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-secondary" onclick="loadFromJson()">↻ 重新載入最新抓取資料</button>
      <button class="btn btn-primary" onclick="openModal()">+ 手動補登 / 微調數據</button>
    </div>
  </div>

  <!-- 主數據表格 -->
  <div class="card">
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th class="sticky-col">日期</th>
            <th>台指收盤</th>
            <th>現貨量(億)</th>
            <th>融資餘額(億)</th>
            <th>美元台幣</th>
            <th>外資現貨</th>
            <th>投信現貨</th>
            <th>自營商現貨</th>
            <th>外資期未平倉</th>
            <th>五大淨額</th>
            <th>十大淨額</th>
            <th>P/C比(%)</th>
            <th>外資選擇權(萬)</th>
            <th>小台散戶比(%)</th>
            <th>微台散戶比(%)</th>
            <th>台積電ADR(%)</th>
            <th style="text-align:center;">趨勢判定</th>
            <th style="text-align:center;">最終分數</th>
            <th style="text-align:center;">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="19" style="text-align:center; padding: 30px; color: #94a3b8;">正在載入 data.json 數據...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- 新增/編輯表單彈窗 (預設隱藏，點擊按鈕才跳出) -->
<div id="formModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="modalTitle">手動補登 / 微調盤後數據</h2>
      <button class="close-btn" onclick="closeModal()">&times;</button>
    </div>
    <form id="dataForm" onsubmit="saveData(event)">
      <input type="hidden" id="editIndex" value="-1" />
      <div class="form-grid">
        <div class="form-group"><label>日期 *</label><input type="date" id="f_date" required /></div>
        <div class="form-group"><label>台指收盤 *</label><input type="number" step="any" id="f_index" required /></div>
        <div class="form-group"><label>現貨量(億) (&lt;8000綠)</label><input type="number" step="any" id="f_vol" required /></div>
        <div class="form-group"><label>融資餘額(億) (增綠/減紅)</label><input type="number" step="any" id="f_margin" required /></div>

        <div class="form-group"><label>美元台幣 (升紅/貶綠)</label><input type="number" step="any" id="f_usd" required /></div>
        <div class="form-group"><label>外資現貨(億) (買紅/賣綠)</label><input type="number" step="any" id="f_foreign" required /></div>
        <div class="form-group"><label>投信現貨(億) (買紅/賣綠)</label><input type="number" step="any" id="f_trust" required /></div>
        <div class="form-group"><label>自營商現貨(億) (買紅/賣綠)</label><input type="number" step="any" id="f_dealer" required /></div>

        <div class="form-group"><label>外資期未平倉 (空增綠)</label><input type="number" step="any" id="f_f_oi" required /></div>
        <div class="form-group"><label>五大淨額 (買紅/賣綠)</label><input type="number" step="any" id="f_top5" required /></div>
        <div class="form-group"><label>十大淨額 (買紅/賣綠)</label><input type="number" step="any" id="f_top10" required /></div>
        <div class="form-group"><label>P/C比(%) (&lt;95綠/&gt;100紅)</label><input type="number" step="any" id="f_pc_ratio" required /></div>
