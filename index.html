<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台股盤後籌碼與多空評分儀表板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; padding: 20px; line-height: 1.5; }
    .container { max-width: 1680px; margin: 0 auto; }
    .header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
    .header h1 { font-size: 24px; font-weight: 700; color: #ffffff; }
    .subtitle { font-size: 13px; color: #94a3b8; margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .update-badge { background: #1e293b; color: #38bdf8; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    .btn-group { display: flex; gap: 10px; }
    .btn { padding: 8px 16px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary { background-color: #0284c7; color: #ffffff; }
    .btn-primary:hover { background-color: #0369a1; }
    .btn-secondary { background-color: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    .btn-secondary:hover { background-color: #334155; }
    .card { background-color: #131a2a; border: 1px solid #1e293b; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden; }
    .table-wrapper { overflow-x: auto; width: 100%; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; text-align: right; }
    thead th { background-color: #0f172a; color: #94a3b8; font-weight: 600; padding: 14px 12px; border-bottom: 1px solid #1e293b; font-size: 12px; }
    tbody tr { border-bottom: 1px solid rgba(30, 41, 59, 0.7); }
    tbody tr:hover { background-color: rgba(30, 41, 59, 0.45); }
    td { padding: 12px; }
    .sticky-col { position: sticky; left: 0; background-color: #131a2a; text-align: left; font-weight: 600; color: #f8fafc; z-index: 2; border-right: 1px solid #1e293b; }
    thead .sticky-col { background-color: #0f172a; z-index: 3; }
    .tw-up { color: #ef4444; font-weight: 600; }
    .tw-down { color: #22c55e; font-weight: 600; }
    .tw-neutral { color: #cbd5e1; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
    .dot-red { background-color: #ef4444; box-shadow: 0 0 6px #ef4444; }
    .dot-green { background-color: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .dot-neutral { background-color: #64748b; }
    .badge { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; display: inline-block; }
    .badge-strong-up { background: rgba(127, 29, 29, 0.6); color: #fca5a5; border: 1px solid #b91c1c; }
    .badge-up { background: rgba(69, 10, 10, 0.6); color: #f87171; border: 1px solid #7f1d1d; }
    .badge-strong-down { background: rgba(6, 78, 59, 0.6); color: #6ee7b7; border: 1px solid #047857; }
    .badge-down { background: rgba(2, 44, 34, 0.6); color: #34d399; border: 1px solid #065f46; }
    .badge-flat { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    .score-btn { background: #1e293b; border: 1px solid #334155; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; text-decoration: underline dotted; }
    .score-btn:hover { background: #334155; }
    .action-link { background: none; border: none; cursor: pointer; font-size: 12px; margin: 0 4px; }
    .edit-link { color: #38bdf8; }
    .del-link { color: #94a3b8; }
    .del-link:hover { color: #ef4444; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.78); z-index: 50; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: #131a2a; border: 1px solid #334155; border-radius: 12px; width: 100%; max-width: 780px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.7); max-height: 90vh; overflow-y: auto; }
    .modal-box.small { max-width: 500px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 12px; margin-bottom: 16px; }
    .modal-header h2 { font-size: 18px; color: #fff; }
    .close-btn { background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 8px 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #f8fafc; font-size: 13px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #1e293b; padding-top: 16px; }
    .detail-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
    .detail-desc { color: #94a3b8; font-size: 12px; margin-left: 8px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h1>台股盤後籌碼與多空評分儀表板</h1>
      <div class="subtitle">
        <span><i class="dot dot-red"></i>紅燈偏多 (+1分) ／ <i class="dot dot-green"></i>綠燈偏空 (-1分)</span>
        <span>｜ 點擊「最終分數」可檢視 14 項指標明細</span>
        <span id="lastUpdateBadge" class="update-badge">讀取自動抓取資料中...</span>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-secondary" onclick="loadFromJson()">↻ 重新載入最新抓取資料</button>
      <button class="btn btn-primary" onclick="openModal()">+ 手動補登 / 微調數據</button>
    </div>
  </div>

  <div class="card">
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th class="sticky-col">日期</th>
            <th>台指收盤</th>
            <th>現貨量(億)</th>
            <th>融資餘額(億)</th>
            <th>美元台幣</th>
            <th>外資現貨</th>
            <th>投信現貨</th>
            <th>自營商現貨</th>
            <th>外資期未平倉</th>
            <th>五大淨額</th>
            <th>十大淨額</th>
            <th>P/C比(%)</th>
            <th>外資選擇權(萬)</th>
            <th>小台散戶比(%)</th>
            <th>微台散戶比(%)</th>
            <th>台積電ADR(%)</th>
            <th style="text-align:center;">趨勢判定</th>
            <th style="text-align:center;">最終分數</th>
            <th style="text-align:center;">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="19" style="text-align:center; padding: 30px; color: #94a3b8;">正在載入 data.json 數據...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div id="formModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="modalTitle">手動補登 / 微調盤後數據</h2>
      <button class="close-btn" onclick="closeModal()">&times;</button>
    </div>
    <form id="dataForm" onsubmit="saveData(event)">
      <input type="hidden" id="editIndex" value="-1" />
      <div class="form-grid">
        <div class="form-group"><label>日期 *</label><input type="date" id="f_date" required /></div>
        <div class="form-group"><label>台指收盤 *</label><input type="number" step="any" id="f_index" required /></div>
        <div class="form-group"><label>現貨量(億) (&lt;8000綠)</label><input type="number" step="any" id="f_vol" required /></div>
        <div class="form-group"><label>融資餘額(億) (增綠/減紅)</label><input type="number" step="any" id="f_margin" required /></div>
        <div class="form-group"><label>美元台幣 (升紅/貶綠)</label><input type="number" step="any" id="f_usd" required /></div>
        <div class="form-group"><label>外資現貨(億) (買紅/賣綠)</label><input type="number" step="any" id="f_foreign" required /></div>
        <div class="form-group"><label>投信現貨(億) (買紅/賣綠)</label><input type="number" step="any" id="f_trust" required /></div>
        <div class="form-group"><label>自營商現貨(億) (買紅/賣綠)</label><input type="number" step="any" id="f_dealer" required /></div>
        <div class="form-group"><label>外資期未平倉 (空增綠)</label><input type="number" step="any" id="f_f_oi" required /></div>
        <div class="form-group"><label>五大淨額 (買紅/賣綠)</label><input type="number" step="any" id="f_top5" required /></div>
        <div class="form-group"><label>十大淨額 (買紅/賣綠)</label><input type="number" step="any" id="f_top10" required /></div>
        <div class="form-group"><label>P/C比(%) (&lt;95綠/&gt;100紅)</label><input type="number" step="any" id="f_pc_ratio" required /></div>
        <div class="form-group"><label>外資選擇權(萬)</label><input type="number" step="any" id="f_f_opt" required /></div>
        <div class="form-group"><label>小台散戶比(%) (多綠/空紅)</label><input type="number" step="any" id="f_mtx_retail" required /></div>
        <div class="form-group"><label>微台散戶比(%) (多綠/空紅)</label><input type="number" step="any" id="f_tmf_retail" required /></div>
        <div class="form-group"><label>台積電ADR漲跌幅(%)</label><input type="number" step="any" id="f_tsm_pct" required /></div>
      </div>
      <div class="modal-footer">
        <button type="reset" class="btn btn-secondary">重設</button>
        <button type="submit" class="btn btn-primary">儲存至本機預覽</button>
      </div>
    </form>
  </div>
</div>

<div id="detailModal" class="modal-overlay">
  <div class="modal-box small">
    <div class="modal-header">
      <h2 id="detailTitle">指標分數明細</h2>
      <button class="close-btn" onclick="document.getElementById('detailModal').classList.remove('active')">&times;</button>
    </div>
    <div id="detailContent"></div>
  </div>
</div>

<script>
  let records = [];

  async function loadFromJson() {
    const badge = document.getElementById('lastUpdateBadge');
    try {
      const res = await fetch('./data.json?t=' + Date.now());
if (!res.ok) throw new Error('找不到 data.json');
const data = await res.json();
records = data.map(function(d) {
let tsmPct = d.tsm_pct;
if (tsmPct === undefined) {
const prevPrice = (d.tsm_adr || 0) - (d.tsm_chg || 0);
tsmPct = prevPrice > 0 ? Number(((d.tsm_chg / prevPrice) * 100).toFixed(2)) : 0;
}
return Object.assign({}, d, { tsm_pct: tsmPct });
});
const firstItem = records.at(0);
if (firstItem && firstItem.update_time) {
badge.innerText = '自動抓取更新時間：' + firstItem.update_time;
} else {
badge.innerText = '已載入 ' + records.length + ' 筆自動抓取數據';
}
renderTable();
} catch (err) {
  badge.innerText = '⚠️ 尚未讀取到 data.json';
  document.getElementById('tableBody').innerHTML =
    '<tr><td colspan="19" style="text-align:center; padding: 30px; color: #f87171;">無法讀取 data.json：' + err.message + '</td></tr>';
}
}

// ...（此處保留原本的 numClass 與 evaluateRow 函式）...

function dotHtml(status) {
  if (status === 'red') return '<i class="dot dot-red"></i>';
  if (status === 'green') return '<i class="dot dot-green"></i>';
  return '<i class="dot dot-neutral"></i>';
}

function renderTable() {
  records.sort(function(a, b) { return b.date.localeCompare(a.date); });
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  records.forEach(function(r, idx) {
    const prev = records.at(idx + 1) || null;
    const evalRes = evaluateRow(r, prev);
    const getSt = function(name) {
      const found = evalRes.items.find(function(i) { return i.name === name; });
      return found ? found.status : 'neutral';
    };
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="sticky-col">' + r.date + '</td>' +
      '<td>' + Number(r.index).toLocaleString() + '</td>' +
      '<td>' + dotHtml(getSt('現貨量')) + r.vol + '</td>' +
      '<td>' + dotHtml(getSt('融資餘額')) + r.margin + '</td>' +
      '<td>' + dotHtml(getSt('美元台幣')) + r.usd + '</td>' +
      '<td class="' + numClass(r.foreign) + '">' + dotHtml(getSt('外資現貨')) + r.foreign + '</td>' +
      '<td class="' + numClass(r.trust) + '">' + dotHtml(getSt('投信現貨')) + r.trust + '</td>' +
      '<td class="' + numClass(r.dealer) + '">' + dotHtml(getSt('自營商現貨')) + r.dealer + '</td>' +
      '<td class="' + numClass(r.f_oi) + '">' + dotHtml(getSt('外資期未平倉')) + Number(r.f_oi).toLocaleString() + '</td>' +
      '<td class="' + numClass(r.top5) + '">' + dotHtml(getSt('五大淨額')) + Number(r.top5).toLocaleString() + '</td>' +
      '<td class="' + numClass(r.top10) + '">' + dotHtml(getSt('十大淨額')) + Number(r.top10).toLocaleString() + '</td>' +
      '<td>' + dotHtml(getSt('P/C比')) + r.pc_ratio + '%</td>' +
      '<td class="' + numClass(r.f_opt) + '">' + dotHtml(getSt('外資選擇權')) + Number(r.f_opt).toLocaleString() + '</td>' +
      '<td>' + dotHtml(getSt('小台散戶比')) + r.mtx_retail + '%</td>' +
      '<td>' + dotHtml(getSt('微台散戶比')) + r.tmf_retail + '%</td>' +
      '<td class="' + numClass(r.tsm_pct) + '">' + dotHtml(getSt('台積電ADR')) + r.tsm_pct + '%</td>' +
      '<td style="text-align:center;"><span class="badge ' + evalRes.trend.cls + '">' + evalRes.trend.text + '</span></td>' +
      '<td style="text-align:center;"><button class="score-btn ' + numClass(evalRes.score) + '" onclick="showDetails(' + idx + ')">' +
      (evalRes.score > 0 ? '+' + evalRes.score : evalRes.score) + ' 分</button></td>' +
      '<td style="text-align:center;">' +
      '<button class="action-link edit-link" onclick="editRow(' + idx + ')">編輯</button>' +
      '<button class="action-link del-link" onclick="deleteRow(' + idx + ')">刪除</button>' +
      '</td>';
    tbody.appendChild(tr);
  });
}

function showDetails(idx) {
  const r = records.at(idx);
  const prev = records.at(idx + 1) || null;
  const evalRes = evaluateRow(r, prev);
  document.getElementById('detailTitle').innerText = r.date + ' 分數明細（總分：' + (evalRes.score > 0 ? '+' + evalRes.score : evalRes.score) + ' 分）';
  document.getElementById('detailContent').innerHTML = evalRes.items.map(function(i) {
    return '<div class="detail-item">' +
      '<div>' + dotHtml(i.status) + '<strong>' + i.name + '</strong><span class="detail-desc">' + i.desc + '</span></div>' +
      '<span class="' + numClass(i.pts) + '">' + (i.pts > 0 ? '+' + i.pts : i.pts) + '</span>' +
      '</div>';
  }).join('');
  document.getElementById('detailModal').classList.add('active');
}

// ...（此處保留 openModal、closeModal、saveData、editRow、deleteRow）...

loadFromJson();
</script>
</body>
</html>
