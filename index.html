<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台股盤後籌碼與多空評分儀表板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 20px; }
    .container { max-width: 1680px; margin: 0 auto; }
    .header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
    .header h1 { font-size: 22px; color: #fff; }
    .subtitle { font-size: 13px; color: #94a3b8; margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .update-badge { background: #1e293b; color: #38bdf8; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    .btn { padding: 8px 14px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #0284c7; color: #fff; }
    .btn-secondary { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    .card { background: #131a2a; border: 1px solid #1e293b; border-radius: 12px; overflow: hidden; }
    .table-wrapper { overflow-x: auto; width: 100%; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; text-align: right; }
    th { background: #0f172a; color: #94a3b8; padding: 12px; border-bottom: 1px solid #1e293b; font-size: 12px; }
    td { padding: 12px; border-bottom: 1px solid rgba(30, 41, 59, 0.7); }
    tr:hover { background: rgba(30, 41, 59, 0.45); }
    .sticky-col { position: sticky; left: 0; background: #131a2a; text-align: left; font-weight: 600; color: #fff; z-index: 2; border-right: 1px solid #1e293b; }
    th.sticky-col { background: #0f172a; z-index: 3; }
    .tw-up { color: #ef4444; font-weight: 600; }
    .tw-down { color: #22c55e; font-weight: 600; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
    .dot-red { background: #ef4444; box-shadow: 0 0 5px #ef4444; }
    .dot-green { background: #22c55e; box-shadow: 0 0 5px #22c55e; }
    .dot-neutral { background: #64748b; }
    .badge { padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; }
    .badge-strong-up { background: rgba(127,29,29,0.6); color: #fca5a5; border: 1px solid #b91c1c; }
    .badge-up { background: rgba(69,10,10,0.6); color: #f87171; border: 1px solid #7f1d1d; }
    .badge-strong-down { background: rgba(6,78,59,0.6); color: #6ee7b7; border: 1px solid #047857; }
    .badge-down { background: rgba(2,44,34,0.6); color: #34d399; border: 1px solid #065f46; }
    .badge-flat { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    .score-btn { background: #1e293b; border: 1px solid #334155; padding: 4px 10px; border-radius: 6px; cursor: pointer; text-decoration: underline dotted; }
    .action-link { background: none; border: none; cursor: pointer; font-size: 12px; margin: 0 4px; color: #38bdf8; }
    .del-link { color: #94a3b8; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: #131a2a; border: 1px solid #334155; border-radius: 12px; width: 100%; max-width: 760px; padding: 20px; max-height: 90vh; overflow-y: auto; }
    .modal-box.small { max-width: 480px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 10px; margin-bottom: 14px; }
    .close-btn { background: none; border: none; color: #94a3b8; font-size: 22px; cursor: pointer; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 7px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; }
    .detail-item { display: flex; justify-content: space-between; padding: 8px 12px; background: #0f172a; border: 1px solid #1e293b; border-radius: 6px; margin-bottom: 6px; font-size: 13px; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>台股盤後籌碼與多空評分儀表板</h1>
      <div class="subtitle">
        <span><i class="dot dot-red"></i>紅燈偏多 (+1分) ／ <i class="dot dot-green"></i>綠燈偏空 (-1分)</span>
        <span>｜ 點擊「最終分數」檢視 14 項明細</span>
        <span id="lastUpdateBadge" class="update-badge">準備載入資料...</span>
      </div>
    </div>
    <div>
      <button class="btn btn-secondary" onclick="loadFromJson()">↻ 重新載入</button>
      <button class="btn btn-primary" onclick="openModal()">+ 新增/微調數據</button>
    </div>
  </div>
  <div class="card">
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th class="sticky-col">日期</th><th>台指收盤</th><th>現貨量(億)</th><th>融資餘額(億)</th><th>美元台幣</th>
            <th>外資現貨</th><th>投信現貨</th><th>自營商現貨</th><th>外資期未平倉</th><th>五大淨額</th>
            <th>十大淨額</th><th>P/C比(%)</th><th>外資選擇權(萬)</th><th>小台散戶比(%)</th><th>微台散戶比(%)</th>
            <th>台積電ADR(%)</th><th style="text-align:center">趨勢判定</th><th style="text-align:center">最終分數</th><th style="text-align:center">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="formModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><h2 id="modalTitle">新增每日盤後數據</h2><button class="close-btn" onclick="closeModal()">&times;</button></div>
    <form id="dataForm" onsubmit="saveData(event)">
      <input type="hidden" id="editIndex" value="-1" />
      <div class="form-grid">
        <div class="form-group"><label>日期</label><input type="date" id="f_date" required /></div>
        <div class="form-group"><label>台指收盤</label><input type="number" step="any" id="f_index" required /></div>
        <div class="form-group"><label>現貨量(億)</label><input type="number" step="any" id="f_vol" required /></div>
        <div class="form-group"><label>融資餘額(億)</label><input type="number" step="any" id="f_margin" required /></div>
        <div class="form-group"><label>美元台幣</label><input type="number" step="any" id="f_usd" required /></div>
        <div class="form-group"><label>外資現貨</label><input type="number" step="any" id="f_foreign" required /></div>
        <div class="form-group"><label>投信現貨</label><input type="number" step="any" id="f_trust" required /></div>
        <div class="form-group"><label>自營商現貨</label><input type="number" step="any" id="f_dealer" required /></div>
        <div class="form-group"><label>外資期未平倉</label><input type="number" step="any" id="f_f_oi" required /></div>
        <div class="form-group"><label>五大淨額</label><input type="number" step="any" id="f_top5" required /></div>
        <div class="form-group"><label>十大淨額</label><input type="number" step="any" id="f_top10" required /></div>
        <div class="form-group"><label>P/C比(%)</label><input type="number" step="any" id="f_pc_ratio" required /></div>
        <div class="form-group"><label>外資選擇權(萬)</label><input type="number" step="any" id="f_f_opt" required /></div>
        <div class="form-group"><label>小台散戶比(%)</label><input type="number" step="any" id="f_mtx_retail" required /></div>
        <div class="form-group"><label>微台散戶比(%)</label><input type="number" step="any" id="f_tmf_retail" required /></div>
        <div class="form-group"><label>台積電ADR(%)</label><input type="number" step="any" id="f_tsm_pct" required /></div>
      </div>
      <div style="text-align:right;gap:8px;display:flex;justify-content:flex-end">
        <button type="reset" class="btn btn-secondary">重設</button>
        <button type="submit" class="btn btn-primary">儲存</button>
      </div>
    </form>
  </div>
</div>

<div id="detailModal" class="modal-overlay">
  <div class="modal-box small">
    <div class="modal-header"><h2 id="detailTitle">指標分數明細</h2><button class="close-btn" onclick="document.getElementById('detailModal').classList.remove('active')">&times;</button></div>
    <div id="detailContent"></div>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
