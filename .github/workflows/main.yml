name: 每日台股籌碼自動更新

on:
  schedule:
    # 每天台灣時間 16:00 執行 (UTC時間 08:00)
    - cron: '0 8 * * 1-5'
  workflow_dispatch: # 允許你隨時手動按按鈕測試

permissions:
  contents: write # 授權機器人可以修改 data.json

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 讀取倉庫檔案
        uses: actions/checkout@v4

      - name: 2. 準備 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安裝爬蟲工具並執行機器人
        run: |
          pip install requests
          python bot.py

      - name: 4. 把新抓到的數據存回倉庫
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "AutoBot"
          git add data.json
          git commit -m "自動更新每日籌碼數據" || exit 0
          git push
