name: Update Taiwan Stock Data

on:
  workflow_dispatch:

  schedule:
    - cron: "17 9 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python
        run: python -m py_compile bot.py

      - name: Run stock collector
        run: python bot.py

      - name: Save data to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update stock market data"
            git push
          fi
